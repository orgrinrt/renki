# Copyright headers, kept current by `ante` rather than by hand.
#
# The whole file is the configuration. `ante` reads its settings from a
# `deno.json` or a `package.json` where a project has one; this crate has
# neither, so the standalone form applies.
#
# `ante check` reports what is out of date, `ante fix` writes it. The point of
# configuring it at all is that a year rolling over, a contributor arriving or
# an address changing is a re-run rather than a hand-edit of every file.

# MPL-2.0, matching `license` in Cargo.toml, which is the one that governs. The
# URL is derived from the identifier and is not stated here, so the two cannot
# disagree.
spdxLicense = "MPL-2.0"

maintainerEmail = "contact@hiisi.digital"

# Contributors come from git rather than from a list somebody maintains: a list
# in a config file is a second copy of what the history already knows, and it
# goes stale silently.
contributorSelection = "commits"
maxContributors = 3

# Every directory that holds Rust: the sources and the tests of every crate
# under `mock/crates/`, plus the lints mockspace compiles. A directory left out
# here still gets a header the first time somebody writes one by hand, and then
# nothing keeps it current, which is the whole thing ante exists to stop.
include = ["mock/crates/*/src/**/*.rs", "mock/crates/*/tests/**/*.rs", "mock/lints/**/*.rs"]

exclude = ["**/target/**"]
