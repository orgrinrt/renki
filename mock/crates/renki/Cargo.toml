# The launcher library. `renki-dirs`, beside it, is the table of where a
# tool's files go, which every tool here wants whether or not renki launches
# it, so it is its own crate and this one depends on it like anybody else does.
[package]
name = "renki"
version = "0.0.3"
edition = "2024"
publish = true
description = "A library for building the launcher half of a two-part command line tool. Repo discovery, the version pin, a shared cache, a backend contract and the handover. Unix only, six dependencies, three of them ours."
license = "MPL-2.0"
homepage = "https://github.com/orgrinrt/renki"
repository = "https://github.com/orgrinrt/renki"
# The repository's readme, which is this crate's: the launcher is what the
# repository is about, and the two smaller crates carry their own beside them.
# Cargo copies whatever `readme` names into the package whether or not
# `include` lists it.
readme = "../../../README.md"
# The floor, measured in both directions rather than guessed. 1.88 builds and
# runs the whole suite clean; 1.87 refuses the let-chains this uses throughout,
# with `let expressions in this position are unstable` at every one of them.
rust-version = "1.88"
# `command-line-interface` rather than `command-line-utilities`: this is a
# library a launcher is written against, not a utility anybody installs.
# There is no `[[bin]]` here and `cargo install renki` installs nothing.
categories = ["development-tools", "command-line-interface"]
# The sources, and the two files a reader of the package needs. The lint configs and the ignore file are ours and are paid for by
# everyone who downloads the crate if they are left in.
#
# No test ships, because neither of them can run where the package lands. The
# header-coverage test reads `ante.toml` and asks git what is tracked. The
# unix-guard test asks rustup which targets are installed and fails loudly
# when the one it needs is absent, which is right in a checkout and wrong in a
# tarball, where it would be the first thing a consumer sees go red.
#
# Both are checks about this repository. A test about the crate would ship, and
# `include_ships_the_crate_tests_and_none_of_the_repository_ones` is what says
# which kind a new one is.
include = [
    "src/**/*.rs",
    "tests/the_readme_tells_the_truth_about_the_package.rs",
    "README.md",
    "LICENSE",
]
keywords = ["launcher", "pinning", "reproducible", "bootstrap", "cli"]

# Kept deliberately small, because every dependency is paid at `cargo install` time by
# a user who only wanted the tool this launches. The pin header is hand-read
# (a handful of top-level keys), cargo's own install-root lock and atomic
# binary install cover concurrency, and the cache key uses a vendored stable
# FNV. The one structured file the launcher owns, the build registry, is real
# TOML with several tables, so it uses serde and toml, both pulled with
# default features off.
[dependencies]
serde = { version = "1", default-features = false, features = ["std", "derive"] }
toml = { version = "0.8", default-features = false, features = ["parse", "display"] }
# Where the cache and the state go, per platform. Ours, from this repository,
# and pulled from the registry like anything else so an install of a published
# renki never reaches for a path. It answers in notko's fallibility types, so
# notko comes with it, with the default features off for the stable floor.
renki-dirs = { version = "0.0.1", path = "../renki-dirs" }
# The configuration contracts, the same way: the schema, the store contract
# and the resolver are theirs, the TOML store and the reading are this
# crate's. `toml_edit` is what `toml` is built on and is already in the
# graph; it is named here for the source spans a list literal borrows.
renki-config = { version = "0.0.1", path = "../renki-config" }
toml_edit = { version = "0.22", default-features = false, features = ["parse"] }
notko = { version = "0.0.1", default-features = false }

[dev-dependencies]
tempfile = "3"
