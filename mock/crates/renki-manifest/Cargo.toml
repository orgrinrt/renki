[package]
name = "renki-manifest"
version = "0.0.1"
edition = "2024"
publish = true
description = "A manifest read off the disk with its layers: the overlays found and ordered, the meta table, named predicates, one merged view, and the TOML store."
license = "MPL-2.0"
homepage = "https://github.com/orgrinrt/renki"
repository = "https://github.com/orgrinrt/renki"
readme = "README.md"
# The same floor as `renki`, for the same reason: the let-chains.
rust-version = "1.88"
categories = ["config", "command-line-interface"]
keywords = ["config", "manifest", "overlays", "toml", "layers"]
# The writer tests read their fixtures, so the fixtures ship with them.
include = ["src/**/*.rs", "tests/**/*.rs", "tests/writer/*/*", "README.md", "LICENSE"]

[dependencies]
