[package]
name = "renki-manifest"
version = "0.0.1"
edition = "2024"
publish = true
description = "A manifest read off the disk with its layers, through the C library and into memory the caller gives. no_std, no alloc, unix."
license = "MPL-2.0"
homepage = "https://github.com/orgrinrt/renki"
repository = "https://github.com/orgrinrt/renki"
readme = "README.md"
# The same floor as `renki`, for the same reason: the let-chains.
rust-version = "1.88"
categories = ["no-std", "config", "command-line-interface"]
keywords = ["config", "manifest", "overlays", "toml", "layers"]
# The writer and host tests read their fixtures, so the fixtures ship with them.
# The POSIX reader's test reads `posix/` at the repository root, which the
# package does not carry, so it stays out.
include = ["src/**/*.rs", "tests/the_c_calls_on_this_host.rs", "tests/the_readme_tells_the_truth_about_the_package.rs", "tests/every_target_unix_names_builds.rs", "tests/writer/*/*", "tests/host/**", "README.md", "LICENSE"]

[dependencies]
# The rules a manifest is read by, and the parser it is read with. Neither
# reaches `std` or an allocator.
renki-config = { version = "0.0.2", path = "../renki-config" }
# A git dependency until `tomlfuse-parse` is published, and renki-manifest
# is not released while it stands.
tomlfuse-parse = { version = "0.0.1-rc.1", git = "https://github.com/orgrinrt/tomlfuse", branch = "work/tomlfuse-parse" }
serde = { version = "1", default-features = false }

# The C library, on the targets `Unix` has a row for and no other.
[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd", target_os = "illumos"))'.dependencies]
libc = { version = "0.2", default-features = false }

[features]
# Spawning a process: a predicate answered by `sh -c` and the untracked-layer
# check through git. Off by default; the launcher turns it on.
processes = []
