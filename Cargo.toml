# The workspace: every crate this repository ships, under `mock/crates/`, which
# is where mockspace reads them from. `renki` is the launcher library,
# `renki-dirs` the table of where a tool's files go, `renki-config` the
# configuration contracts. Each is published on its own; nothing is published
# from here.
[workspace]
members = ["mock/crates/*"]
resolver = "3"
